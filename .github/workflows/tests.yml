name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: RTL support contract test
        run: php tests/rtl-support-contract-test.php

      - name: Translation quality contract test
        run: php tests/translation-quality-contract-test.php
